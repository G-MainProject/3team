server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: backend-api
  
  # 데이터베이스 설정 (MySQL - 개발용)
  datasource:
    url: jdbc:mysql://localhost:3306/team3_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 0278
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 로깅 설정
logging:
  level:
    com.team3.backendapi: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
