# fly.toml

app = '3team'
primary_region = 'icn'

# 이 [env] 블록을 추가하거나 수정해야 합니다.
# 값은 "dummy"로 넣어도 괜찮습니다. 실제 값은 Fly.io Secrets에서 가져옵니다.
[env]
  DART_API_KEY = "dummy"
  GOOGLE_API_KEY = "dummy"
  REDDIT_CLIENT_ID = "dummy"
  REDDIT_CLIENT_SECRET = "dummy"
  KIWOOM_BASE = "dummy"
  KIWOOM_APPKEY = "dummy"
  KIWOOM_SECRETKEY = "dummy"
  NAVER_CLIENT_ID = "dummy"
  NAVER_CLIENT_SECRET = "dummy"
  # React에서 사용할 변수들은 API로 전달해야 합니다.
  # 여기서는 Spring이 읽을 수 있도록만 설정합니다.
  VITE_FIREBASE_API_KEY = "dummy" 
  VITE_FIREBASE_APP_ID = "dummy"
  VITE_FIREBASE_AUTH_DOMAIN = "dummy"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "dummy"
  VITE_FIREBASE_PROJECT_ID = "dummy"
  VITE_FIREBASE_STORAGE_BUCKET = "dummy"
  VITE_API_URL = "dummy"


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
